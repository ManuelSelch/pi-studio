prepare:
  command: [bash, scripts/prepare.sh]
  cwd: .
  timeoutSeconds: 180
suites:
  piui:
    command: [bash, scripts/test-package.sh]
    cwd: .
    timeoutSeconds: 180
    auto: after-agent
  ios-unit:
    command: [bash, scripts/test-app.sh, ios, unit]
    cwd: .
    timeoutSeconds: 300
    auto: manual
  ios-ui:
    command: [bash, scripts/test-app.sh, ios, ui]
    cwd: .
    timeoutSeconds: 600
    auto: manual
  macos-unit:
    command: [bash, scripts/test-app.sh, macos, unit]
    cwd: .
    timeoutSeconds: 300
    auto: manual
  ios-release:
    command: [bash, scripts/test-app.sh, ios, release]
    cwd: .
    timeoutSeconds: 300
    auto: manual
  macos-release:
    command: [bash, scripts/test-app.sh, macos, release]
    cwd: .
    timeoutSeconds: 300
    auto: manual
