name: Release builds

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  PI_STUDIO_SKIP_MACRO_VALIDATION: '1'

jobs:
  release:
    name: Native Release build (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain diagnostics
        run: |
          mkdir -p .build/ci-logs
          echo "PI_STUDIO_BUILD_ROOT=$RUNNER_TEMP/pi-studio-${{ matrix.platform }}-release" >> "$GITHUB_ENV"
          { xcodebuild -version; swift --version; } 2>&1 | tee .build/ci-logs/toolchain.log
      - name: Resolve packages
        run: bash scripts/prepare.sh 2>&1 | tee .build/ci-logs/prepare.log
      - name: Native Release build
        run: bash scripts/test-app.sh ${{ matrix.platform }} release 2>&1 | tee .build/ci-logs/${{ matrix.platform }}-release.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}-release-failure-logs
          path: .build/ci-logs/
          retention-days: 7
          if-no-files-found: warn
